# AlphaAgent example config
data:
  source: csv              # csv | akshare | tushare
  root: ./data             # for csv: directory of <symbol>.csv files
  symbols:
    - "600000"
    - "000001"
  start: 2023-01-01
  end: 2023-12-31
  freq: 1d                 # 1d | 1m | 5m | 15m | 30m | 60m
  adjust: qfq              # qfq | hfq | "" (akshare/tushare only)
  cache_dir: ./data/cache  # enables local parquet cache; remove to disable
  # tushare_token: ""      # or set TUSHARE_TOKEN env var

calendar:
  enabled: false           # set true to filter non-trading days / sessions
  cache_path: ./data/cache/ashare_calendar.parquet

risk:                      # portfolio-level limits (optional; omit fields to disable)
  # max_gross_exposure: 0.8         # total positions <= 80% equity
  # max_per_symbol_exposure: 0.3    # any single symbol <= 30% equity
  # max_position_count: 10          # hold <= 10 symbols simultaneously
  # max_sector_exposure: 0.4        # any single sector <= 40% equity
  # sectors:                        #   inline symbol -> sector map
  #   "600000": "银行"
  #   "000001": "银行"
  #   "600519": "白酒"
  # sectors_csv: ./data/sectors.csv #   or load from CSV (symbol,sector)
  # max_pairwise_correlation: 0.85  # reject new symbol if |corr| > X with any held
  # correlation_lookback: 60        # days of returns used for correlation

strategy:
  name: ma_cross
  params:
    fast: 5
    slow: 20

portfolio:
  initial_cash: 1000000
  target_pct: 0.3          # allocate 30% of equity per BUY signal
  commission_rate: 0.0003  # 万三
  min_commission: 5.0
  stamp_tax_rate: 0.001    # 千一 (卖出)

execution:
  slippage_bps: 5          # 5 bps one-way slippage

agent:
  enabled: false           # set true to route decisions through Claude
  provider: claude
  model: claude-sonnet-4-6
