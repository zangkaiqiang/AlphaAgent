[project]
name = "alphaagent"
version = "0.1.0"
description = "Event-driven quantitative trading engine for A-share market with optional LLM agent layer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AlphaAgent" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "click>=8.1",
    "apscheduler>=3.10",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
data = [
    "akshare>=1.14",
    "tushare>=1.4",
    "duckdb>=1.0",
    "pyarrow>=16.0",
]
agent = [
    "anthropic>=0.40",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
]

[project.scripts]
alphaagent = "alphaagent.cli:main"
alphaagent-api = "alphaagent.api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alphaagent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "B027", "N818", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
